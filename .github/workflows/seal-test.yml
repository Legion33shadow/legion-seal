# Dogfooding : chaque release de ce dépôt scelle verify_seal.py via seal-release-action, marqué test (exclu des compteurs).
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir dist && cp verify_seal.py dist/ && sha256sum dist/*
      - run: python3 --version && (python3 -c "import cryptography; print('cryptography', cryptography.__version__)" || echo "cryptography ABSENT")
      - id: seal
        uses: Legion33shadow/seal-release-action@main
        with:
          files: dist/*
          test: "true"
          fail-on-error: "true"
      - run: echo '${{ steps.seal.outputs.receipts }}'
      - uses: actions/upload-artifact@v4
        with:
          name: seal-receipts
          path: seal-receipts/
